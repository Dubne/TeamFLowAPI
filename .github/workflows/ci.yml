name: TeamFlowAPI CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamflow_db
          POSTGRES_USER: teamflow_user
          POSTGRES_PASSWORD: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow_user -d teamflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      POSTGRES_DB: teamflow_db
      POSTGRES_USER: teamflow_user
      POSTGRES_PASSWORD: teamflow
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"         
          cache: pip                      
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest 

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cat > .env << 'ENVEOF'
          SECRET_KEY=ci-only-secret-key
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1

          POSTGRES_DB=teamflow
          POSTGRES_USER=teamflow
          POSTGRES_PASSWORD=teamflow
          POSTGRES_HOST=db
          POSTGRES_PORT=5432

          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          ENVEOF

      - name: Build and start Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Check application HTTP
        run: curl --retry 5 --retry-delay 2 --retry-connrefused --fail http://localhost:8000/admin/login/ -o /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v


  publish-image:
    name: publish-image
    needs: [test, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: deploy
    needs: publish-image                    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production                 
    concurrency:
      group: deploy-production
      cancel-in-progress: false             

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:                                
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy production compose-file 
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: scp docker-compose.prod.yml "$SSH_USER@$SSH_HOST:/opt/teamflow/docker-compose.prod.yml"

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: ssh "$SSH_USER@$SSH_HOST" "bash -s -- ${GITHUB_SHA}" < deploy/remote-deploy.sh

      - name: Check site from outside
        env:
          APP_URL: ${{ vars.APP_URL }}      
        run: curl -fsS --retry 5 --retry-delay 5 "$APP_URL/admin/login/" > /dev/null




  