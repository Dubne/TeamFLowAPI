name: TeamFlowAPI CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamflow_db
          POSTGRES_USER: teamflow_user
          POSTGRES_PASSWORD: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow_user -d teamflow_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      POSTGRES_DB: teamflow_db
      POSTGRES_USER: teamflow_user
      POSTGRES_PASSWORD: teamflow
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"         
          cache: pip                      
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest 



  